
<style>
  /* Botón de cambio de tema */
  #theme-toggle {
    cursor: pointer;
    border: 1px solid #8b949e;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    padding: 5px 10px;
    font-size: 19px;
  }

  #theme-toggle:hover {
    background: rgba(128, 128, 128, 0.15);
  }

  /* Modo oscuro */
  html[data-theme="dark"] {
    color-scheme: dark;
    background: #0d1117;
  }

  html[data-theme="dark"] body,
  html[data-theme="dark"] main,
  html[data-theme="dark"] .markdown-body,
  html[data-theme="dark"] .container-lg {
    background-color: #0d1117 !important;
    color: #e6edf3 !important;
  }

  html[data-theme="dark"] h1,
  html[data-theme="dark"] h2,
  html[data-theme="dark"] h3,
  html[data-theme="dark"] h4,
  html[data-theme="dark"] p,
  html[data-theme="dark"] li,
  html[data-theme="dark"] strong,
  html[data-theme="dark"] span {
    color: #e6edf3 !important;
    border-color: #30363d !important;
  }

  html[data-theme="dark"] a,
  html[data-theme="dark"] a span {
    color: #79c0ff !important;
  }

  html[data-theme="dark"] nav,
  html[data-theme="dark"] hr {
    border-color: #30363d !important;
  }

  html[data-theme="dark"] pre,
  html[data-theme="dark"] code {
    background-color: #161b22 !important;
    color: #e6edf3 !important;
  }

  html[data-theme="dark"] table tr {
    background-color: #0d1117 !important;
    color: #e6edf3 !important;
  }

  html[data-theme="dark"] table tr:nth-child(even) {
    background-color: #161b22 !important;
  }

  /* Logotipos oscuros sobre fondo oscuro */
  html[data-theme="dark"] img[src$="github.svg"],
  html[data-theme="dark"] img[src$="openai.svg"] {
    filter: invert(1);
  }
</style>

<nav style="display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid #ddd; padding: 12px 0; margin-bottom: 25px;">

  <!-- Navegación principal -->
  <div style="display: flex; align-items: center; gap: 25px; flex-wrap: wrap;">

    <a href="{{ '/' | relative_url }}">Mi perfil</a>

    <a href="{{ '/cv/' | relative_url }}">CV</a>

    <a href="{{ '/publicaciones/' | relative_url }}">Publicaciones</a>

    <a href="{{ '/investigacion/' | relative_url }}">Investigación</a>

    <!-- Cambio de tema -->
    <button id="theme-toggle"
            type="button"
            aria-label="Activar modo oscuro"
            title="Cambiar tema">
      ☾
    </button>

  </div>

  <!-- Perfiles profesionales -->
  <div style="display: flex; align-items: center; gap: 15px;">

    <a href="https://github.com/DanielPajita"
       aria-label="GitHub"
       title="GitHub">
      <img src="{{ '/imagenes/github.svg' | relative_url }}"
           alt="GitHub"
           width="24"
           height="24">
    </a>

    <a href="https://www.linkedin.com/in/daniel-leandro-pajita-dominguez-93657a265/"
       aria-label="LinkedIn"
       title="LinkedIn">
      <img src="{{ '/imagenes/linkedin.svg' | relative_url }}"
           alt="LinkedIn"
           width="24"
           height="24">
    </a>

  </div>

</nav>

<script>
(function () {
  const clave = "tema-danielpajita";
  let guardado = "light";

  try {
    guardado = localStorage.getItem(clave) || "light";
  } catch (error) {}

  document.documentElement.setAttribute(
    "data-theme",
    guardado === "dark" ? "dark" : "light"
  );

  const boton = document.getElementById("theme-toggle");
  if (!boton) return;

  function actualizarBoton() {
    const oscuro =
      document.documentElement.getAttribute("data-theme") === "dark";

    boton.textContent = oscuro ? "☀" : "☾";

    boton.setAttribute(
      "aria-label",
      oscuro ? "Activar modo claro" : "Activar modo oscuro"
    );

    boton.setAttribute(
      "title",
      oscuro ? "Activar modo claro" : "Activar modo oscuro"
    );
  }

  actualizarBoton();

  boton.addEventListener("click", function () {
    const actual =
      document.documentElement.getAttribute("data-theme");

    const nuevo = actual === "dark" ? "light" : "dark";

    document.documentElement.setAttribute("data-theme", nuevo);

    try {
      localStorage.setItem(clave, nuevo);
    } catch (error) {}

    actualizarBoton();
  });
})();
</script>
