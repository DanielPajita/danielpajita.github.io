name: Compilar CV y publicar GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Compilar CV en LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: documentos/cv
          root_file: CV_Daniel_Pajita.tex
          post_compile: latexmk -c CV_Daniel_Pajita.tex

      - name: Verificar PDF generado
        run: test -s documentos/cv/CV_Daniel_Pajita.pdf

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir sitio web con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verificar PDF en el sitio web
        run: test -s _site/documentos/cv/CV_Daniel_Pajita.pdf

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4